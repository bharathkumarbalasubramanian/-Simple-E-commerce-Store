{% extends 'base.html' %}
{% block title %}Shopping Cart - CodeAlpha Store{% endblock %}

{% block content %}
<h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 2rem;">Your Shopping Cart</h1>

<div id="cart-content-wrapper">
  <div style="text-align: center; padding: 3rem;">Loading shopping cart...</div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', loadCartPage);

async function loadCartPage() {
  const container = document.getElementById('cart-content-wrapper');
  try {
    const res = await API.authFetch('/api/cart');
    const data = await res.json();

    if (!data.items || data.items.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; padding: 5rem 1rem; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--glass-border);">
          <h2 style="font-size: 1.5rem; font-weight: 700;">Your Cart is Currently Empty</h2>
          <p style="color: var(--text-muted); margin-top: 0.5rem; margin-bottom: 2rem;">Explore products on the storefront and add items to your cart.</p>
          <a href="/" class="btn btn-primary" style="padding: 0.8rem 2rem;">Explore Storefront</a>
        </div>
      `;
      return;
    }

    let rowsHtml = data.items.map(item => `
      <tr id="cart-row-${item.id}" class="cart-row">
        <td>
          <div class="cart-item-info">
            <img src="${item.product.image_url || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600'}" alt="${item.product.name}" class="cart-item-img">
            <div>
              <a href="/product/${item.product.slug}" style="font-weight: 600;">${item.product.name}</a>
              <div style="font-size: 0.8rem; color: var(--text-muted);">Stock: ${item.product.stock} available</div>
            </div>
          </div>
        </td>
        <td style="font-weight: 600;">$${item.product.price.toFixed(2)}</td>
        <td>
          <div class="quantity-control">
            <button type="button" class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity - 1})">-</button>
            <input type="number" value="${item.quantity}" readonly class="qty-input">
            <button type="button" class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity + 1})">+</button>
          </div>
        </td>
        <td style="font-weight: 700; color: var(--accent-secondary);">$${item.subtotal.toFixed(2)}</td>
        <td>
          <button type="button" class="btn btn-danger btn-sm" onclick="removeItem(${item.id})">Remove</button>
        </td>
      </tr>
    `).join('');

    container.innerHTML = `
      <div class="cart-layout">
        <div style="overflow-x: auto;">
          <table class="cart-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>

        <div class="order-summary-card">
          <h2 style="font-size: 1.3rem; font-weight: 700; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.75rem;">Order Summary</h2>
          <div class="summary-row"><span>Subtotal</span><strong>$${data.subtotal.toFixed(2)}</strong></div>
          <div class="summary-row"><span>Shipping</span><strong>${data.shipping === 0 ? 'FREE' : '$' + data.shipping.toFixed(2)}</strong></div>
          <div class="summary-row"><span>Estimated Tax (8%)</span><strong>$${data.tax.toFixed(2)}</strong></div>
          <div class="summary-row total"><span>Total</span><strong style="color: var(--accent-primary);">$${data.grand_total.toFixed(2)}</strong></div>
          <a href="/checkout" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">Proceed to Checkout</a>
          <a href="/" class="btn btn-secondary btn-block">Continue Shopping</a>
        </div>
      </div>
    `;
  } catch (e) {
    container.innerHTML = `<div style="color: var(--danger); text-align: center;">Error loading cart.</div>`;
  }
}

async function updateQty(itemId, newQty) {
  const res = await API.authFetch(`/api/cart/update/${itemId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ quantity: newQty })
  });
  if (res.ok) {
    loadCartPage();
    API.fetchCartBadge();
  }
}

async function removeItem(itemId) {
  const res = await API.authFetch(`/api/cart/remove/${itemId}`, {
    method: 'DELETE'
  });
  if (res.ok) {
    showToast('Item removed from cart');
    loadCartPage();
    API.fetchCartBadge();
  }
}
</script>
{% endblock %}
