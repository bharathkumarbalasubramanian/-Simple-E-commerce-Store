{% extends 'base.html' %}
{% block title %}Checkout - CodeAlpha Store{% endblock %}

{% block content %}
<h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 2rem;">Checkout &amp; Shipping Details</h1>

<form id="checkout-form">
  <div class="cart-layout">
    <div style="background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 2rem;">
      <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.75rem;">
        Shipping Address
      </h2>

      <div class="form-group">
        <label class="form-label" for="full_name">Full Name *</label>
        <input type="text" id="full_name" required class="form-control" placeholder="e.g. John Doe">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address *</label>
        <input type="email" id="email" required class="form-control" placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="address">Street Address *</label>
        <input type="text" id="address" required class="form-control" placeholder="123 Tech Boulevard">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="city">City *</label>
          <input type="text" id="city" required class="form-control" placeholder="San Francisco">
        </div>
        <div class="form-group">
          <label class="form-label" for="postal_code">Postal Code *</label>
          <input type="text" id="postal_code" required class="form-control" placeholder="94105">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="country">Country *</label>
        <input type="text" id="country" required value="United States" class="form-control">
      </div>
    </div>

    <div class="order-summary-card">
      <h2 style="font-size: 1.3rem; font-weight: 700; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.75rem;">Checkout Summary</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Review your details and place order.</p>

      <button type="submit" class="btn btn-primary btn-block" style="padding: 0.9rem; font-size: 1.05rem; margin-top: 1rem;">
        Place Order
      </button>
      <a href="/cart" class="btn btn-secondary btn-block">Back to Cart</a>
    </div>
  </div>
</form>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('checkout-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const full_name = document.getElementById('full_name').value.trim();
  const email = document.getElementById('email').value.trim();
  const address = document.getElementById('address').value.trim();
  const city = document.getElementById('city').value.trim();
  const postal_code = document.getElementById('postal_code').value.trim();
  const country = document.getElementById('country').value.trim();

  try {
    const res = await API.authFetch('/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ full_name, email, address, city, postal_code, country })
    });

    const data = await res.json();
    if (res.ok) {
      showToast(`Order #${data.id} placed successfully!`);
      setTimeout(() => window.location.href = `/order-success/${data.id}`, 600);
    } else {
      showToast(data.detail || 'Checkout failed', 'error');
    }
  } catch (err) {
    showToast('Error processing checkout request', 'error');
  }
});
</script>
{% endblock %}
