{% extends 'base.html' %}
{% block title %}Create Account - CodeAlpha Store{% endblock %}

{% block content %}

<div class="auth-container">
  <div class="auth-header">
    <h1 class="auth-title">Create an Account</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.4rem;">Join CodeAlpha Store to manage orders &amp; faster checkout.</p>
  </div>

  <form id="register-form">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" required class="form-control" placeholder="Choose a username">
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input type="email" id="email" required class="form-control" placeholder="enter@email.com">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" required class="form-control" placeholder="Create a password">
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 1.5rem;">
      Register Account
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
    Already have an account? <a href="/login" style="color: var(--accent-primary); font-weight: 600;">Sign In Here</a>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });

    const data = await res.json();
    if (res.ok) {
      API.setAuth(data.access_token, data.username);
      showToast(`Account created! Welcome, ${data.username}`);
      setTimeout(() => window.location.href = '/', 600);
    } else {
      showToast(data.detail || 'Registration failed', 'error');
    }
  } catch (err) {
    showToast('Failed to connect to authentication server', 'error');
  }
});
</script>
{% endblock %}
