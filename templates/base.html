<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodeAlpha E-Commerce Store - FastAPI Backend & Modern Local App Auth">
  <title>{% block title %}CodeAlpha E-Commerce Store{% endblock %}</title>
  
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="nav-brand" id="nav-brand-logo">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
      </svg>
      <span>CodeAlpha Store</span>
    </a>

    <!-- Global Product Search -->
    <form action="/" method="GET" class="search-form" id="search-form">
      <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input type="text" name="q" value="{{ query|default:'' }}" placeholder="Search products..." class="search-input" id="search-input-field">
    </form>

    <!-- Navigation Actions & Cart -->
    <div class="nav-actions">
      <a href="/admin" target="_blank" class="nav-link" style="color: var(--accent-secondary); font-weight: 600;">Admin Portal</a>

      <a href="/cart" class="cart-btn" id="nav-cart-btn">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/>
        </svg>
        <span>Cart</span>
        <span class="cart-badge" id="cart-badge">0</span>
      </a>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="container">
    <div id="messages-container"></div>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 CodeAlpha Store. Single-Server FastAPI + SQLAdmin Portal &amp; Local Application Auth.</p>
    </div>
  </footer>

  <!-- API & Auth Engine Script -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/main.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
